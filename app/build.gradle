plugins {
    alias(libs.plugins.android.application)
    id 'com.google.gms.google-services' // Firebase
}

android {
    namespace 'com.example.festivehub'
    compileSdk {
        version = release(36)
    }

    defaultConfig {
        applicationId "com.example.festivehub"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // AndroidX / Material
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Firebase (versions come from the BoM, so no version numbers below)
    implementation platform('com.google.firebase:firebase-bom:35.2.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    // implementation 'com.google.firebase:firebase-storage'   // only if you upload images

    // UI helper
    implementation 'com.intuit.sdp:sdp-android:1.1.1'
    implementation libs.credentials
    implementation libs.credentials.play.services.auth
    implementation libs.googleid// sdp

    // Testing
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    //QR code
//    implementation("com.journeys:zxing-android-embedded:4.3.0")
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.3'
}